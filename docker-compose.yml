services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${TASKPILOT_POSTGRES_DB:-taskpilot}
      POSTGRES_USER: ${TASKPILOT_POSTGRES_USER:-taskpilot}
      POSTGRES_PASSWORD: ${TASKPILOT_POSTGRES_PASSWORD:?set TASKPILOT_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${TASKPILOT_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${TASKPILOT_REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${TASKPILOT_RABBITMQ_USER:-taskpilot}
      RABBITMQ_DEFAULT_PASS: ${TASKPILOT_RABBITMQ_PASSWORD:?set TASKPILOT_RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${TASKPILOT_RABBITMQ_HOST_PORT:-5672}:5672"
      - "${TASKPILOT_RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${TASKPILOT_OLLAMA_HOST_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      TASKPILOT_OLLAMA_MODEL: ${TASKPILOT_OLLAMA_MODEL:-llama3.2:3b}
      TASKPILOT_EMBEDDING_MODEL: ${TASKPILOT_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$TASKPILOT_OLLAMA_MODEL\" && ollama pull \"$$TASKPILOT_EMBEDDING_MODEL\""]
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${TASKPILOT_JAEGER_HOST_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "${TASKPILOT_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${TASKPILOT_OTLP_HTTP_HOST_PORT:-4318}:4318"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${TASKPILOT_POSTGRES_DB:-taskpilot};Username=${TASKPILOT_POSTGRES_USER:-taskpilot};Password=${TASKPILOT_POSTGRES_PASSWORD:?set TASKPILOT_POSTGRES_PASSWORD in .env}
      ConnectionStrings__Redis: redis:6379
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${TASKPILOT_RABBITMQ_USER:-taskpilot}
      RabbitMq__Password: ${TASKPILOT_RABBITMQ_PASSWORD:?set TASKPILOT_RABBITMQ_PASSWORD in .env}
      RabbitMq__VirtualHost: /
      Jwt__Issuer: TaskPilot
      Jwt__Audience: TaskPilot
      Jwt__Secret: ${TASKPILOT_JWT_SECRET:?set TASKPILOT_JWT_SECRET in .env}
      Jwt__AccessTokenExpirationMinutes: "15"
      Jwt__RefreshTokenExpirationDays: "7"
      Observability__OtlpEndpoint: http://otel-collector:4317
      Ollama__Endpoint: http://ollama:11434
      Ollama__Model: ${TASKPILOT_OLLAMA_MODEL:-llama3.2:3b}
      Ai__Provider: ${TASKPILOT_AI_PROVIDER:-Ollama}
      Ai__Endpoint: ${TASKPILOT_AI_ENDPOINT:-http://ollama:11434}
      Ai__Model: ${TASKPILOT_AI_MODEL:-llama3.2:3b}
      Ai__ApiKey: ${TASKPILOT_AI_API_KEY:-}
      Semantic__Endpoint: http://ollama:11434
      Semantic__Model: ${TASKPILOT_EMBEDDING_MODEL:-nomic-embed-text}
      Semantic__BackfillEnabled: ${TASKPILOT_SEMANTIC_BACKFILL_ENABLED:-true}
      Features__Interop__McpEnabled: ${TASKPILOT_MCP_ENABLED:-false}
      Features__Interop__A2aEnabled: ${TASKPILOT_A2A_ENABLED:-false}
      HttpsRedirection__Enabled: "false"
      Persistence__ApplyMigrationsOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "${TASKPILOT_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  ollama-data:
